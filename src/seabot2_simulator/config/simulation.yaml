simulation_node:
  ros__parameters:
    simu_robot_mass: 12.0
    simu_salinity: 0.0
    simu_chi: 0.0
    simu_chi2: 0.0
    simu_volume_air_V0: 15e-6 #m3
    simu_volume_equilibrium: 110e-6 #m3
    simu_pressure_sensor_stddev: 1e-3 #2e-3 # bar
    simu_time_step: 1000000 # ns # keep minimum 1ms to avoid issue with motor simulation
    seafloor_depth: 40.0 # m
    #temperature_profile_file: "temperature_profile_guerledan_2023_10_09.profile"
    temperature_profile_file: ""
    temperature_sensor_coeff: 0.04
    temperature_sensor_stddev: 0.005 #0.01

    temperature_keeping_k: 0.5

    kalman_robot_mass: 12.0
    kalman_enable_kalman_depth: 0.5
    kalman_piston_volume_eq_init: 110e-6 #m3
    kalman_init_chi: 0.0
    kalman_init_chi2: 0.0
    kalman_init_cz: 1.0
    kalman_init_volume_air: 15e-6

    kalman_gamma_alpha_velocity: 1e-6
    kalman_gamma_alpha_depth: 1e-6
    kalman_gamma_alpha_offset: 1e-7
    kalman_gamma_alpha_chi: 1e-15
    kalman_gamma_alpha_chi2: 1e-15
    kalman_gamma_alpha_cz: 1e-3
    kalman_gamma_alpha_volume_air: 1e-6

    kalman_gamma_init_velocity: 1e-3
    kalman_gamma_init_depth: 1e-3
    kalman_gamma_init_offset: 10e-6 #m3
    kalman_gamma_init_chi: 1e-10
    kalman_gamma_init_chi2: 1e-10
    kalman_gamma_init_cz: 1e-3
    kalman_gamma_init_volume_air: 5e-6

    kalman_gamma_beta_depth: 5e-3

    dc_robot_mass: 12.0
    dc_root_regulation: -0.25
    dc_limit_depth_control: 0.5
    dc_flow_piston_sink: -5e-7
    dc_piston_flow_security_percentage: 0.5
    dc_hold_depth_enable: false
    dc_hold_depth_value_enter: 0.0
    dc_hold_depth_value_exit: 0.0
    dc_hold_velocity_enter: 0.0
    dc_hold_velocity_exit: 0.0
    dc_control_filter: true
    dc_delta_velocity_lb: -1e-3
    dc_delta_velocity_ub: 1e-3
    dc_delta_position_lb: -10e-3
    dc_delta_position_ub: 10e-3

