control:
  depth_control_node:
    ros__parameters:
      root_regulation: -0.25
      limit_depth_control: 0.5 # m
      flow_piston_sink: -5e-7 # m3/s
      piston_hysteresis: 0.6

      hold_depth_enable: true
      hold_depth_value_enter: 0.005 # m
      hold_depth_value_exit: 0.01 # m
      hold_velocity_enter: 0.001 # m/s
      hold_velocity_exit: 0.005 # m/s

      control_filter: false
      delta_velocity_lb: -1e-3 # m/s
      delta_velocity_ub: 1e-3 # m/s
      delta_position_lb: -10e-3 # m
      delta_position_ub: 10e-3 # m

