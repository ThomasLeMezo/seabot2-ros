driver:
  gpsd_node:
    ros__parameters:
      frame_id: "gps"

  bme280_node:
    ros__parameters:
      loop_dt: 200 #ms

  pressure_ms5803_node:
    ros__parameters:
      loop_dt: 200 #ms

  pressure_ms5837_node:
    ros__parameters:
      loop_dt: 200 #ms

  light_node:
    ros__parameters:
      flash_duration: 1
      flash_pause_between_flash: 5
      flash_pause_end: 40

  piston_node:
    ros__parameters:
      loop_dt: 100 #ms
      delay_reset_if_no_data: 30

  power_node:
    ros__parameters:
      loop_dt: 100 #ms

  screen_node:
    ros__parameters:
      loop_dt: 500
      depth_no_update: 3.0 # meter

  thruster_node:
    ros__parameters:
      loop_dt: 100
      coeff_cmd_to_pwm: 10.0
      delay_stop: 500 #ms
      max_angular_velocity: 1.0
      max_linear_velocity: 1.0
      max_velocity_pwm: 1000.0
      allow_backward: true

  ping_node:
    ros__parameters:
      ping_interval: 1000 #ms
      enable_ping: true
      mode_auto: true
      speed_of_sound: 1440.0
      gain_setting: 1

  temperature_node:
    ros__parameters:
      loop_dt: 100 #ms
      i2c_address: 0x76


